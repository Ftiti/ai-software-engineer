[project]
name = "ai-software-engineer"
version = "0.1.0"
description = "An AI software engineering agent built on LangGraph, LangChain and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "mcp>=1.30.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.8.5",
]
gemini = [
    "langchain-google-genai>=4.5.2",
]
groq = [
    "langchain-groq>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".specify"]  # vendored by Spec Kit

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.uv.sources]
ai-software-engineer = { workspace = true }

[dependency-groups]
dev = [
    "ai-software-engineer[gemini,groq,openai]",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
